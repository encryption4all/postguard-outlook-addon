name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (no errors, no warnings)
        run: npx eslint -c eslint.config.mjs --max-warnings=0 "src/**/*.{ts,js}"

      - name: Prettier (format check)
        run: npx prettier --check "src/**/*.{ts,js}"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Validate manifest
        run: npm run validate

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # node --test --experimental-strip-types needs Node >= 22.6, so this job
      # cannot share the check job's Node 20.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (node:test)
        run: npm test

  nginx:
    name: nginx config test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Mirrors the Dockerfile, which serves nginx/default.conf from
      # /etc/nginx/conf.d/default.conf on nginx:1.27-alpine. Mounting the conf
      # into that same image and running `nginx -t` validates it in the real
      # http{} context (the map blocks live there), so a malformed CORS/header
      # config fails CI instead of breaking the deployed add-in.
      - name: Validate nginx config (nginx -t)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
