<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PostGuard</title>
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
    ></script>
    <link href="yivi.min.css" rel="stylesheet" type="text/css" />
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
  </head>
  <body class="pg-app">
    <div id="pg-status" class="pg-status pg-status-hidden" role="status"></div>

    <main class="pg-main">
      <!-- Loading view -->
      <section id="view-loading" class="pg-view">
        <div class="pg-spinner" role="status" aria-live="polite">
          <span class="pg-sr-only">Loading</span>
        </div>
      </section>

      <!-- Compose view -->
      <section id="view-compose" class="pg-view" hidden>
        <div class="pg-toggle-row">
          <label class="pg-switch">
            <input type="checkbox" id="pg-toggle-encrypt" aria-labelledby="pg-toggle-label" />
            <span class="pg-switch-track" aria-hidden="true"></span>
          </label>
          <span id="pg-toggle-label" class="pg-toggle-label"></span>
        </div>

        <div id="pg-bcc-warning" class="pg-warning" role="alert" hidden></div>

        <div id="pg-manage-section" class="pg-policy-section">
          <h3 id="pg-manage-title" class="pg-section-title"></h3>
          <div id="pg-manage-panel"></div>
        </div>

        <button id="pg-btn-encrypt-send" class="pg-btn pg-btn-primary" type="button"></button>
      </section>

      <!-- Yivi flow view (QR + scan) -->
      <section id="view-yivi" class="pg-view" hidden>
        <h2 id="pg-yivi-title" class="pg-section-title"></h2>
        <p id="pg-yivi-subtitle" class="pg-subtitle"></p>
        <div id="yivi-web-form" class="pg-yivi-host"></div>
        <div class="pg-button-row pg-button-row-end">
          <button id="pg-btn-yivi-cancel" class="pg-btn pg-btn-secondary" type="button"></button>
        </div>
      </section>

      <!-- Read-mode encrypted detection -->
      <section id="view-read-encrypted" class="pg-view" hidden>
        <p id="pg-read-encrypted-text" class="pg-subtitle"></p>
        <button id="pg-btn-decrypt" class="pg-btn pg-btn-primary" type="button"></button>
      </section>

      <!-- Read-mode was-encrypted (decrypted previously) -->
      <section id="view-read-was-encrypted" class="pg-view" hidden>
        <div class="pg-info">
          <span id="pg-was-encrypted-text"></span>
        </div>
      </section>

      <!-- Read-mode plaintext (just decrypted) -->
      <section id="view-decrypted" class="pg-view" hidden>
        <div id="pg-decrypted-badges" class="pg-badges"></div>
        <div id="pg-decrypted-meta" class="pg-meta"></div>
        <h3 id="pg-decrypted-subject" class="pg-decrypted-subject"></h3>
        <iframe
          id="pg-decrypted-body"
          class="pg-decrypted-body"
          title="Decrypted message body"
          sandbox="allow-same-origin"
          referrerpolicy="no-referrer"
        ></iframe>
        <div id="pg-decrypted-attachments" class="pg-decrypted-attachments" hidden></div>
      </section>

      <!-- Not-applicable (read mode but no PostGuard content) -->
      <section id="view-read-noop" class="pg-view" hidden>
        <p id="pg-read-noop-text" class="pg-subtitle"></p>
      </section>

      <!-- Error view -->
      <section id="view-error" class="pg-view" hidden>
        <div class="pg-error" id="pg-error-text"></div>
        <button id="pg-error-retry" class="pg-btn pg-btn-secondary" type="button"></button>
      </section>

      <!-- Settings view -->
      <section id="view-settings" class="pg-view" hidden>
        <h2 id="pg-settings-title" class="pg-section-title"></h2>

        <h3 id="pg-settings-encryption-title" class="pg-section-title pg-section-subtitle"></h3>
        <div class="pg-toggle-row">
          <label class="pg-switch">
            <input
              type="checkbox"
              id="pg-toggle-encryption-default"
              aria-labelledby="pg-settings-encryption-default-label"
            />
            <span class="pg-switch-track" aria-hidden="true"></span>
          </label>
          <span id="pg-settings-encryption-default-label" class="pg-toggle-label"></span>
        </div>
        <p id="pg-settings-encryption-default-help" class="pg-subtitle"></p>

        <h3 id="pg-settings-prefill-title" class="pg-section-title pg-section-subtitle"></h3>
        <p id="pg-settings-prefill-help" class="pg-subtitle"></p>
        <div class="pg-policy-attr">
          <label for="pg-prefill-fullname" id="pg-prefill-fullname-label"></label>
          <div class="pg-policy-attr-input">
            <input id="pg-prefill-fullname" type="text" autocomplete="name" />
          </div>
        </div>
        <div class="pg-policy-attr">
          <label for="pg-prefill-dateofbirth" id="pg-prefill-dateofbirth-label"></label>
          <div class="pg-policy-attr-input">
            <input id="pg-prefill-dateofbirth" type="date" />
          </div>
        </div>
        <div class="pg-policy-attr">
          <label for="pg-prefill-mobile" id="pg-prefill-mobile-label"></label>
          <div class="pg-policy-attr-input">
            <input id="pg-prefill-mobile" type="tel" placeholder="+31612345678" autocomplete="tel" />
          </div>
        </div>

        <h3 id="pg-settings-advanced-title" class="pg-section-title pg-section-subtitle"></h3>
        <div class="pg-toggle-row">
          <label class="pg-switch">
            <input
              type="checkbox"
              id="pg-toggle-allow-optimistic-dialog"
              aria-labelledby="pg-settings-optimistic-label"
            />
            <span class="pg-switch-track" aria-hidden="true"></span>
          </label>
          <span id="pg-settings-optimistic-label" class="pg-toggle-label"></span>
        </div>
        <p id="pg-settings-optimistic-help" class="pg-subtitle"></p>

        <div class="pg-button-row pg-button-row-end">
          <button id="pg-settings-back" class="pg-btn pg-btn-secondary" type="button"></button>
          <button id="pg-settings-save" class="pg-btn pg-btn-primary" type="button"></button>
        </div>
      </section>
    </main>

    <footer class="pg-footer" hidden id="pg-footer">
      <button id="pg-open-settings" class="pg-btn pg-btn-secondary pg-footer-btn" type="button">
        <span class="pg-footer-btn-icon" aria-hidden="true">⚙</span>
        <span id="pg-open-settings-label" class="pg-footer-btn-label"></span>
      </button>
    </footer>
  </body>
</html>
